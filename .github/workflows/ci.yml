name: LiftLab CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: liftlab
          POSTGRES_PASSWORD: liftlab
          POSTGRES_DB: liftlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://liftlab:liftlab@localhost:5432/liftlab
      MLFLOW_TRACKING_URI: http://localhost:5001   # not running: logging is skipped fast

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      # Tests use simulated data with known effects; no dataset download needed.
      - name: Tests with coverage gate
        run: pytest tests/ -q --cov=liftlab --cov-report=term-missing --cov-fail-under=85

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install "ruff==0.17.5"
      - run: ruff check src/ tests/ scripts/
