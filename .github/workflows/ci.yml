# .github/workflows/ci.yml
name: LiftLab CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: liftlab
          POSTGRES_PASSWORD: liftlab
          POSTGRES_DB: liftlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Create .env
        run: |
          cp .env.example .env
          echo "DATABASE_URL=postgresql://liftlab:liftlab@localhost:5432/liftlab" >> .env
          echo "MLFLOW_TRACKING_URI=http://localhost:5001" >> .env

      - name: Create minimal test data
        run: |
          mkdir -p data
          python -c "
          import pandas as pd
          import numpy as np
          rng = np.random.default_rng(42)
          n = 5000
          df = pd.DataFrame({
              **{f'f{i}': rng.standard_normal(n) for i in range(12)},
              'treatment': rng.binomial(1, 0.85, n),
              'conversion': rng.binomial(1, 0.003, n),
              'visit': rng.binomial(1, 0.05, n),
              'exposure': rng.binomial(1, 0.8, n),
          })
          df.to_csv('data/criteo_uplift.csv', index=False)
          print(f'Created test dataset: {len(df)} rows')
          "

      - name: Run tests (exclude slow tests)
        run: |
          pytest tests/ -v \
            --ignore=tests/test_estimate_full_coverage.py \
            --ignore=tests/test_uplift_models.py \
            -k "not causalforest"

      - name: Lint
        run: ruff check src/ --exit-zero
